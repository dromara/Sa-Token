# 端口
server:
    port: 8087

# Sa-Token配置
sa-token:
    # Token名称 (同时也是cookie名称)
    token-name: satoken
    # Token有效期，单位s 默认30天, -1代表永不过期
    timeout: 2592000
    # Token风格
    token-style: uuid
    # Sa-Token 单独使用的 Redisson 连接（Redisson 原生 yaml）
    alone-redisson:
        config: |
            singleServerConfig:
                address: "redis://127.0.0.1:6379"
                database: 2

# 业务使用的 Redisson 连接（Boot 3 前缀为 spring.data.redis）
spring:
    data:
        redis:
            redisson:
                config: |
                    singleServerConfig:
                        address: "redis://127.0.0.1:6379"
                        database: 0
