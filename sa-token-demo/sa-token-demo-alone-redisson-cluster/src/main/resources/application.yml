# 端口
server:
    port: 8085

# Sa-Token配置
sa-token:
    # Token名称 (同时也是cookie名称)
    token-name: satoken
    # Token有效期，单位s 默认30天, -1代表永不过期
    timeout: 2592000
    # Token风格
    token-style: uuid
    # Sa-Token 单独使用的 Redisson 集群连接（Redisson 原生 yaml）
    alone-redisson:
        config: |
            clusterServersConfig:
                nodeAddresses:
                    - "redis://127.0.0.1:3000"
                    - "redis://127.0.0.1:3001"
                    - "redis://127.0.0.1:3002"

# 业务仍使用单机 Redis
spring:
    redis:
        redisson:
            config: |
                singleServerConfig:
                    address: "redis://127.0.0.1:6379"
                    database: 0
