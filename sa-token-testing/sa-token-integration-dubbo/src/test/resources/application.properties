sa-token.is-print=false
sa-token.is-log=false
sa-token.check-same-token=true

dubbo.application.name=sa-token-dubbo-it
dubbo.application.qos-enable=false
dubbo.registry.address=N/A
dubbo.protocol.name=dubbo
# dubbo.protocol.port 由 DubboHttpIntegrationTest 的 @DynamicPropertySource 动态分配空闲端口
dubbo.consumer.check=false
dubbo.consumer.injvm=false
dubbo.consumer.scope=remote

# check=false 时 consumer 先连、provider 后起，Dubbo 会 WARN 打整摞栈
logging.level.org.apache.dubbo.remoting.transport.AbstractClient=ERROR
